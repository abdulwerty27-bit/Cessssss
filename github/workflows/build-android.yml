name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NEXUS-CHESS-PROJECT.zip'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded project archive
        run: |
          mkdir -p project
          if [ -f NEXUS-CHESS-PROJECT.zip ]; then
            unzip -q NEXUS-CHESS-PROJECT.zip -d project
          else
            echo 'NEXUS-CHESS-PROJECT.zip was not found in repository root.'
            exit 1
          fi
          test -f project/package.json
          test -f project/capacitor.config.json
          test -f project/www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: project
        run: npm install
      - name: Add Android platform
        working-directory: project
        run: npx cap add android
      - name: Sync web assets
        working-directory: project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: project/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-chess-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
